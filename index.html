<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ポーランドボールと学ぼう！中2一次関数（全46問）</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="app-container">
    <!-- ヘッダー -->
    <header class="app-header">
      <div class="header-brand">
        <img src="images/polandball.jpg" alt="ポーランドボール" class="header-logo" onclick="showStageSelect()">
        <div class="header-title">
          <h1>一次関数マスター！</h1>
          <p id="sub-title">全46問スペシャル版</p>
        </div>
      </div>
      <div class="header-stats">
        <button class="btn-stage-select" onclick="showStageSelect()">コース選択</button>
        <div class="stat-badge">
          <span>⭐</span>
          <span id="star-count">0</span>
        </div>
      </div>
    </header>

    <!-- メインコンテンツ -->
    <main class="main-content">

      <!-- コース・ステージ選択画面 -->
      <div class="stage-select-screen" id="stage-select-screen">
        <h2 style="font-size: 1.4rem; font-weight: 900; color: var(--primary); text-align: center; margin-bottom: 12px;">
          好きなコースをえらんでね！（全46問）
        </h2>
        <div class="stage-grid" id="stage-grid">
          <!-- JSで動的生成 -->
        </div>
      </div>

      <!-- クイズプレイ画面 (初期非表示) -->
      <div id="quiz-play-screen" style="display: none; flex-direction: column; gap: 20px;">

        <!-- 進捗バー -->
        <div class="progress-section">
          <button onclick="showStageSelect()" style="background:none; border:none; font-size:1.2rem; cursor:pointer;">🏠</button>
          <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progress-fill"></div>
          </div>
          <div class="progress-text" id="progress-text">第 1 / 46 問</div>
        </div>

        <!-- ポーランドボールキャラクターダイアログ -->
        <div class="character-banner" id="char-banner" style="background: linear-gradient(135deg, #FF4B4B 0%, #FF8585 100%);">
          <img src="images/polandball.jpg" alt="キャラ" class="character-avatar" id="char-avatar">
          <div class="speech-bubble" id="char-speech">
            Kurwa! 一次関数のきほんの形を覚えるよ！
          </div>
        </div>

        <!-- 問題カードエリア -->
        <div class="question-card" id="question-card">
          <div class="question-header">
            <h2 class="question-title" id="q-title">第1問：一次関数の【名前】を覚えよう！</h2>
            <p class="question-desc" id="q-desc">説明文がここに入ります</p>
          </div>

          <!-- 式・穴埋めカード -->
          <div id="q-equation-area">
            <!-- JSで動的生成 -->
          </div>

          <!-- 視覚化グラフエリア -->
          <div class="graph-container">
            <canvas id="graphCanvas"></canvas>
          </div>

          <!-- アクションボタンエリア (①やってみる → ②わからない → ③解答) -->
          <div class="action-bar">
            <button class="btn-hint" onclick="handleHintClick()">
              <span>💡 わからない</span>
            </button>
            <button class="btn-submit" onclick="handleSubmitClick()">
              <span>✨ 解答する！</span>
            </button>
          </div>
        </div>
      </div>

      <!-- 全問/ステージクリア結果画面 (初期非表示) -->
      <div class="result-screen" id="result-screen" style="display: none;">
        <img src="images/banner.jpg" alt="バンナー" class="result-banner-img celebrate-anim">
        <h2 style="font-size: 1.8rem; font-weight: 900; color: var(--primary);" id="result-title">🎉 コースクリア！おめでとう！</h2>
        <p style="font-size: 1.1rem; font-weight: 700;" id="result-desc">君は一次関数のマスターだ！</p>
        
        <div style="width: 100%;">
          <h3 style="margin-bottom: 12px; font-weight: 900;">🏆 ゲットした国旗バッジコレクション</h3>
          <div class="badge-grid" id="badge-grid">
            <!-- JSで動的追加 -->
          </div>
        </div>

        <button class="btn-submit" onclick="showStageSelect()" style="margin-top: 20px; width: 80%;">
          <span>🗺️ コース選択へもどる</span>
        </button>
      </div>

    </main>
  </div>

  <!-- ヒントモーダル -->
  <div class="modal-overlay" id="hint-modal">
    <div class="modal-card">
      <div class="modal-header">
        <span style="font-size: 2rem;">💡</span>
        <h3 id="hint-modal-title">ポーランドボールからのヒント</h3>
      </div>
      <div class="modal-body" id="hint-modal-body">
        ヒント内容がここに入ります。
      </div>
      <button class="btn-modal-close" onclick="closeModal('hint-modal')">わかった！とじる</button>
    </div>
  </div>

  <!-- 解答確認＆正誤判定モーダル -->
  <div class="modal-overlay" id="result-modal">
    <div class="modal-card">
      <div class="modal-header">
        <span id="result-modal-icon" style="font-size: 2.5rem;">🎉</span>
        <h3 id="result-modal-title">せいかい！</h3>
      </div>
      <div class="modal-body" id="result-modal-body">
        解説がここに入ります。
      </div>
      <button class="btn-submit" id="result-modal-next-btn" onclick="nextQuestion()">つぎの問題へ！ ➔</button>
    </div>
  </div>

  <!-- 選択肢ダイアログモーダル -->
  <div class="modal-overlay" id="choice-modal">
    <div class="modal-card">
      <div class="modal-header">
        <h3>あてはまる言葉を選んでね！</h3>
      </div>
      <div class="options-grid" id="choice-options">
        <!-- JSで選択肢ボタン生成 -->
      </div>
    </div>
  </div>

  <!-- iPad用オンスクリーンテンキーパッド -->
  <div class="keypad-sheet" id="keypad-sheet">
    <div class="keypad-header">
      <span class="keypad-title">数字を入力しよう</span>
      <button onclick="closeKeypad()" style="background:none; border:none; font-size:1.5rem; font-weight:bold; cursor:pointer;">✕</button>
    </div>
    <div class="keypad-display" id="keypad-display"></div>
    <div class="keypad-grid">
      <button class="key-btn" onclick="pressKey('1')">1</button>
      <button class="key-btn" onclick="pressKey('2')">2</button>
      <button class="key-btn" onclick="pressKey('3')">3</button>
      <button class="key-btn" onclick="pressKey('4')">4</button>
      <button class="key-btn" onclick="pressKey('5')">5</button>
      <button class="key-btn" onclick="pressKey('6')">6</button>
      <button class="key-btn" onclick="pressKey('7')">7</button>
      <button class="key-btn" onclick="pressKey('8')">8</button>
      <button class="key-btn" onclick="pressKey('9')">9</button>
      <button class="key-btn action-key" onclick="pressKey('-')">ー</button>
      <button class="key-btn" onclick="pressKey('0')">0</button>
      <button class="key-btn action-key" onclick="pressKey('BS')">⌫</button>
      <button class="key-btn confirm-key" onclick="confirmKeypad()">決 定</button>
    </div>
  </div>

  <!-- JS スクリプト読み込み -->
  <script src="questions.js"></script>
  <script src="sound.js"></script>
  <script src="app.js"></script>
</body>
</html>
